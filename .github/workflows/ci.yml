name: Django CI/CD

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.0
        env:
          POSTGRES_DB: project5
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: project5
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry and dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction --no-ansi

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up SSH key for server
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 81.26.178.240 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy project to server
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude '.idea' \
            --exclude 'ssh_key.txt*' \
            --exclude '.coverage' \
            --exclude 'celerybeat-schedule' \
            ./ yc-user@81.26.178.240:~/app/

      - name: Build and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key yc-user@81.26.178.240 \
            "cd ~/app && docker compose up -d --build"

      - name: Apply migrations
        run: |
          ssh -i ~/.ssh/deploy_key yc-user@81.26.178.240 \
            "cd ~/app && docker compose exec -T web python manage.py migrate --noinput"

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 http://81.26.178.240:8080/swagger/ > /dev/null; then
              echo "Deploy OK: site responds"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed"
          exit 1
